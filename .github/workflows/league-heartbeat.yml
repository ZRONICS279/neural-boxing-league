name: Keep league clock moving

on:
  schedule:
    # Sites does not install the Worker's cron trigger, so the source repository
    # wakes the public tick even when nobody has the ring open.
    - cron: "3-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: league-heartbeat
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Advance the live league
        run: >-
          curl --fail --silent --show-error
          --retry 3 --retry-delay 5
          --max-time 110 --output /dev/null
          https://forgeleague.space/api/league
